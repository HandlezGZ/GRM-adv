services:
  # Project 1: LexFlow (Process Automation & Request Triage)
  lexflow-backend:
    build:
      context: projects/lexflow
      dockerfile: backend/Dockerfile
    container_name: lexflow-backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CLASSIFICATION_MODE=rules
      - DATABASE_URL=sqlite:///./lexflow.db
    volumes:
      - lexflow_data:/app
    restart: unless-stopped

  lexflow-frontend:
    build:
      context: projects/lexflow
      dockerfile: frontend/Dockerfile
    container_name: lexflow-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://lexflow-backend:8000
    depends_on:
      - lexflow-backend
    restart: unless-stopped

volumes:
  lexflow_data:
