services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lexflow-backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CLASSIFICATION_MODE=rules
      - DATABASE_URL=sqlite:///./lexflow.db
    volumes:
      - lexflow_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lexflow-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lexflow_data:
