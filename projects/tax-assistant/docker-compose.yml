version: "3.8"

services:
  tax-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lextax-backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - API_PORT=8002
      - DATABASE_URL=sqlite:///./lextax.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  tax-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lextax-frontend
    command: streamlit run frontend/app.py --server.port 8503 --server.address 0.0.0.0
    ports:
      - "8503:8503"
    volumes:
      - .:/app
    environment:
      - API_BASE_URL=http://tax-backend:8002/api/v1
    depends_on:
      tax-backend:
        condition: service_healthy
