version: "3.8"

services:
  tax-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lextax-backend
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=production
      - API_PORT=8002
      - DATABASE_URL=sqlite:///./lextax.db
    volumes:
      - lextax_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tax-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: lextax-frontend
    ports:
      - "8503:8503"
    environment:
      - VITE_API_URL=http://tax-backend:8002/api/v1
    depends_on:
      tax-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lextax_data:
