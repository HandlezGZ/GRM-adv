version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./lexeval.db
      - FASTAPI_PORT=8001
      - API_V1_STR=/api/v1
    volumes:
      - ./lexeval.db:/app/lexeval.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    environment:
      - BACKEND_URL=http://backend:8001
      - STREAMLIT_PORT=8502
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
