version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lexeval-backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./lexeval.db
      - FASTAPI_PORT=8001
      - API_V1_STR=/api/v1
    volumes:
      - lexeval_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: lexeval-frontend
    ports:
      - "8502:8502"
    environment:
      - VITE_API_URL=http://backend:8001/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lexeval_data:
